name: Keep Render service alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      RENDER_SERVICE_URL: ${{ secrets.RENDER_SERVICE_URL }}
    steps:
      - name: Check Render health
        shell: bash
        run: |
          if [ -z "${RENDER_SERVICE_URL:-}" ]; then
            echo "RENDER_SERVICE_URL secret is unset." >&2
            exit 1
          fi
          curl --fail --silent --show-error --max-time 65 "${RENDER_SERVICE_URL%/}/health"
